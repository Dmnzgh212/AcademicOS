name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-engine-boundaries:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev,wasm]'
      - name: Windows Engine boundaries
        run: python -m pytest -q tests/test_lifehub_engine_lease.py tests/test_lifehub_windows_control.py tests/test_lifehub_component_ipc.py tests/test_lifehub_readiness_shutdown.py
      - name: Build and install Windows wheel
        shell: pwsh
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv "$env:RUNNER_TEMP/lifehub-win-wheel"
          $wheel = (Get-ChildItem dist/academicos-*.whl)[0].FullName
          & "$env:RUNNER_TEMP/lifehub-win-wheel/Scripts/python.exe" -m pip install $wheel 'wasmtime>=36,<37'
      - name: Windows installed component IPC smoke
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/lifehub-win-wheel/Scripts/python.exe" -I scripts/lifehub_component_ipc_smoke.py "$env:GITHUB_WORKSPACE"
      - name: Windows independent third-party app proof
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/lifehub-win-wheel/Scripts/python.exe" -I examples/lifehub-third-party-apps/run_demo.py
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,wasm]'
      - name: Ruff
        run: python -m ruff check src tests examples/lifehub scripts/lifehub_wheel_smoke.py scripts/build_lifehub_examples.py scripts/lifehub_platform_smoke.py
      - name: Pytest
        run: python -m pytest -q
      - name: Build and install wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv "$RUNNER_TEMP/lifehub-wheel-venv"
          "$RUNNER_TEMP/lifehub-wheel-venv/bin/python" -m pip install dist/academicos-*.whl 'wasmtime>=36,<37'
      - name: Installed wheel smoke
        run: |
          "$RUNNER_TEMP/lifehub-wheel-venv/bin/python" scripts/lifehub_wheel_smoke.py "$GITHUB_WORKSPACE"
      - name: Platform lifecycle and HTTP smoke
        run: |
          "$RUNNER_TEMP/lifehub-wheel-venv/bin/python" -I scripts/lifehub_platform_smoke.py "$GITHUB_WORKSPACE"
      - name: Installed component IPC lifecycle smoke
        run: |
          python -m ruff check scripts/lifehub_component_ipc_smoke.py
          "$RUNNER_TEMP/lifehub-wheel-venv/bin/python" -I scripts/lifehub_component_ipc_smoke.py "$GITHUB_WORKSPACE"
      - name: Independent third-party app proof (real daemon process)
        run: |
          python -m ruff check examples/lifehub-third-party-apps/run_demo.py
          "$RUNNER_TEMP/lifehub-wheel-venv/bin/python" -I examples/lifehub-third-party-apps/run_demo.py
      - name: Examples archive smoke
        run: |
          python scripts/build_lifehub_examples.py "$RUNNER_TEMP/lifehub-examples.zip"
          python scripts/build_lifehub_examples.py "$RUNNER_TEMP/lifehub-examples-repeat.zip"
          cmp "$RUNNER_TEMP/lifehub-examples.zip" "$RUNNER_TEMP/lifehub-examples-repeat.zip"
          python -m zipfile -e "$RUNNER_TEMP/lifehub-examples.zip" "$RUNNER_TEMP/lifehub-examples"
          "$RUNNER_TEMP/lifehub-wheel-venv/bin/python" "$RUNNER_TEMP/lifehub-examples/scripts/lifehub_wheel_smoke.py" "$RUNNER_TEMP/lifehub-examples"
