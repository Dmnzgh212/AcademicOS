name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-engine-boundaries:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev,wasm]'
      - name: Windows Engine boundaries
        run: python -m pytest -q tests/test_lifehub_engine_lease.py tests/test_lifehub_windows_control.py tests/test_lifehub_component_ipc.py tests/test_lifehub_readiness_shutdown.py tests/test_lifehub_background_guest.py tests/test_lifehub_proof_startup.py tests/test_lifehub_recovery_evidence.py
      - name: Build and install Windows wheel
        shell: pwsh
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv "$env:RUNNER_TEMP/lifehub-win-wheel"
          $wheel = (Get-ChildItem dist/academicos-*.whl)[0].FullName
          & "$env:RUNNER_TEMP/lifehub-win-wheel/Scripts/python.exe" -m pip install $wheel 'wasmtime>=36,<37'
      - name: Build standalone Windows proof source kit
        shell: pwsh
        run: |
          python scripts/build_lifehub_examples.py dist/lifehub-engine-examples.zip
          python -m zipfile -e dist/lifehub-engine-examples.zip "$env:RUNNER_TEMP/lifehub-engine-kit"
      - name: Windows installed component IPC smoke
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/lifehub-win-wheel/Scripts/python.exe" -I scripts/lifehub_component_ipc_smoke.py "$env:GITHUB_WORKSPACE"
      - name: Windows independent third-party app proof
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/lifehub-win-wheel/Scripts/python.exe" -I "$env:RUNNER_TEMP/lifehub-engine-kit/examples/lifehub-third-party-apps/run_demo.py"
      - name: Windows persistent background guest proof
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/lifehub-win-wheel/Scripts/python.exe" -I "$env:RUNNER_TEMP/lifehub-engine-kit/examples/lifehub-background-apps/run_demo.py"
      - name: Windows automatic recovery proof
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/lifehub-win-wheel/Scripts/python.exe" -I "$env:RUNNER_TEMP/lifehub-engine-kit/examples/lifehub-background-apps/run_recovery.py" --output "$env:RUNNER_TEMP/lifehub-recovery-evidence" | Tee-Object -FilePath "$env:RUNNER_TEMP/lifehub-recovery-proof.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: External AI integrator energy apps (installed Windows wheel)
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/lifehub-win-wheel/Scripts/python.exe" -I "$env:RUNNER_TEMP/lifehub-engine-kit/examples/lifehub-external-energy/independent_proof.py" --output "$env:RUNNER_TEMP/external-energy-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve independent Windows integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-energy-windows-python-3.12
          path: |
            ${{ runner.temp }}/external-energy-evidence/packages/*.lhpkg
            ${{ runner.temp }}/external-energy-evidence/evidence.json
            ${{ runner.temp }}/external-energy-evidence/engine.log
            dist/*.whl
            dist/lifehub-engine-examples.zip
      - name: Check Windows retained evidence
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/academicos-*.whl)[0].FullName
          python scripts/check_lifehub_recovery_evidence.py "$env:RUNNER_TEMP/lifehub-recovery-evidence" $wheel "$env:RUNNER_TEMP/lifehub-recovery-proof.log" "$env:GITHUB_SHA" "$env:RUNNER_TEMP/lifehub-recovery-evidence/validation.json"
      - name: Preserve Windows recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-windows-python-3.12
          path: |
            ${{ runner.temp }}/lifehub-recovery-evidence/packages/*.lhpkg
            ${{ runner.temp }}/lifehub-recovery-evidence/evidence.json
            ${{ runner.temp }}/lifehub-recovery-evidence/validation.json
            ${{ runner.temp }}/lifehub-recovery-evidence/engine.log
            ${{ runner.temp }}/lifehub-recovery-proof.log
            dist/*.whl
            dist/lifehub-engine-examples.zip
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,wasm]'
      - name: Ruff
        run: python -m ruff check src tests examples/lifehub scripts/lifehub_wheel_smoke.py scripts/build_lifehub_examples.py scripts/lifehub_platform_smoke.py
      - name: Pytest
        run: python -m pytest -q
      - name: Background source lint
        run: python -m ruff check examples/lifehub-background-apps
      - name: Build and install wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv "$RUNNER_TEMP/lifehub-wheel-venv"
          "$RUNNER_TEMP/lifehub-wheel-venv/bin/python" -m pip install dist/academicos-*.whl 'wasmtime>=36,<37'
      - name: Build standalone Linux proof source kit
        run: |
          python scripts/build_lifehub_examples.py dist/lifehub-engine-examples.zip
          python -m zipfile -e dist/lifehub-engine-examples.zip "$RUNNER_TEMP/lifehub-engine-kit"
      - name: Installed wheel smoke
        run: |
          "$RUNNER_TEMP/lifehub-wheel-venv/bin/python" scripts/lifehub_wheel_smoke.py "$GITHUB_WORKSPACE"
      - name: Platform lifecycle and HTTP smoke
        run: |
          "$RUNNER_TEMP/lifehub-wheel-venv/bin/python" -I scripts/lifehub_platform_smoke.py "$GITHUB_WORKSPACE"
      - name: Installed component IPC lifecycle smoke
        run: |
          python -m ruff check scripts/lifehub_component_ipc_smoke.py
          "$RUNNER_TEMP/lifehub-wheel-venv/bin/python" -I scripts/lifehub_component_ipc_smoke.py "$GITHUB_WORKSPACE"
      - name: Independent third-party app proof (real daemon process)
        run: |
          python -m ruff check examples/lifehub-third-party-apps/run_demo.py
          "$RUNNER_TEMP/lifehub-wheel-venv/bin/python" -I "$RUNNER_TEMP/lifehub-engine-kit/examples/lifehub-third-party-apps/run_demo.py"
      - name: Persistent background guest proof (real daemon process)
        run: |
          "$RUNNER_TEMP/lifehub-wheel-venv/bin/python" -I "$RUNNER_TEMP/lifehub-engine-kit/examples/lifehub-background-apps/run_demo.py"
      - name: Automatic recovery proof
        run: |
          "$RUNNER_TEMP/lifehub-wheel-venv/bin/python" -I "$RUNNER_TEMP/lifehub-engine-kit/examples/lifehub-background-apps/run_recovery.py" --output "$RUNNER_TEMP/lifehub-recovery-evidence" | tee "$RUNNER_TEMP/lifehub-recovery-proof.log"
      - name: External AI integrator energy apps (installed Linux wheel)
        run: |
          python -m ruff check examples/lifehub-external-energy/independent_proof.py
          "$RUNNER_TEMP/lifehub-wheel-venv/bin/python" -I "$RUNNER_TEMP/lifehub-engine-kit/examples/lifehub-external-energy/independent_proof.py" --output "$RUNNER_TEMP/external-energy-evidence"
      - name: Preserve independent Linux integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-energy-linux-python-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/external-energy-evidence/packages/*.lhpkg
            ${{ runner.temp }}/external-energy-evidence/evidence.json
            ${{ runner.temp }}/external-energy-evidence/engine.log
            dist/*.whl
            dist/lifehub-engine-examples.zip
      - name: Check Linux retained evidence
        run: |
          python scripts/check_lifehub_recovery_evidence.py "$RUNNER_TEMP/lifehub-recovery-evidence" dist/academicos-*.whl "$RUNNER_TEMP/lifehub-recovery-proof.log" "$GITHUB_SHA" "$RUNNER_TEMP/lifehub-recovery-evidence/validation.json"
      - name: Preserve Linux recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-linux-python-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/lifehub-recovery-evidence/packages/*.lhpkg
            ${{ runner.temp }}/lifehub-recovery-evidence/evidence.json
            ${{ runner.temp }}/lifehub-recovery-evidence/validation.json
            ${{ runner.temp }}/lifehub-recovery-evidence/engine.log
            ${{ runner.temp }}/lifehub-recovery-proof.log
            dist/*.whl
            dist/lifehub-engine-examples.zip
      - name: Examples archive smoke
        run: |
          python scripts/build_lifehub_examples.py "$RUNNER_TEMP/lifehub-examples.zip"
          python scripts/build_lifehub_examples.py "$RUNNER_TEMP/lifehub-examples-repeat.zip"
          cmp "$RUNNER_TEMP/lifehub-examples.zip" "$RUNNER_TEMP/lifehub-examples-repeat.zip"
          python -m zipfile -e "$RUNNER_TEMP/lifehub-examples.zip" "$RUNNER_TEMP/lifehub-examples"
          "$RUNNER_TEMP/lifehub-wheel-venv/bin/python" "$RUNNER_TEMP/lifehub-examples/scripts/lifehub_wheel_smoke.py" "$RUNNER_TEMP/lifehub-examples"
