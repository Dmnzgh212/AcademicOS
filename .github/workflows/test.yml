name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,wasm]'
      - name: Ruff
        run: python -m ruff check src tests examples/lifehub scripts/lifehub_wheel_smoke.py
      - name: Pytest
        run: python -m pytest -q
      - name: Build and install wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/academicos-*.whl 'wasmtime>=36,<37'
      - name: Installed wheel smoke
        run: .wheel-venv/bin/python scripts/lifehub_wheel_smoke.py "$GITHUB_WORKSPACE"
