[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "academicos"
version = "0.1.0"
description = "Local-first academic event intelligence and adaptive planning."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "python-dateutil>=2.9",
  "requests>=2.32",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
brightspace = ["playwright>=1.48"]
mail = ["msal>=1.31"]
ollama = ["httpx>=0.27"]

[project.scripts]
academicos = "academicos.cli:app"
academicos-collect = "academicos.sources.cli:app"
academicos-sync = "academicos.sources.sync_cli:app"
academicos-health = "academicos.sources.health_cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
