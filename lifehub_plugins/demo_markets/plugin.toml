manifest_version = 1
api = "lifehub@1"
id = "demo.markets"
name = "Markets"
version = "0.2.0"
description = "Synthetic market snapshot for validating the open LifeHub extension contract."

[permissions]
storage_read = []
storage_write = ["markets"]
network_retrieval = []
localhost_ports = []

[[contributes]]
id = "snapshot"
point = "workspace.widget"
title = "Markets"
entrypoint = "lifehub.primitive"

[contributes.config]
namespace = "markets.snapshot"
renderer = "metric"
width = 4
height = 3
limit = 8
description = "Compact local market snapshot."
default_workspace = true
