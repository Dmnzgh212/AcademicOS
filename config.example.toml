[app]
timezone = "America/Toronto"
data_dir = "D:/AcademicOSData"
database = "D:/AcademicOSData/academicos.db"

[privacy]
cloud_policy = "explicit_only"
background_cloud_calls = false

[calendar]
day_start = "08:00"
day_end = "23:30"
default_break_minutes = 15
minimum_study_block_minutes = 30
maximum_study_block_minutes = 120

[planner]
replan_on_material_change = true
replan_on_progress_change = true
freeze_started_blocks = true
freeze_completed_blocks = true

[brightspace]
enabled = true
host = "https://uottawa.brightspace.com"
auth_dir = ".auth/brightspace"
token_env = "BRIGHTSPACE_TOKEN"
le_version = "1.75"
lp_version = "1.51"
download_files = true

# Default: do not add brightspace.courses blocks. AcademicOS discovers active
# Brightspace course offerings from your imported timetable + myenrollments.
# Add a block only when a course is ambiguous or you need a per-course override.
#
# [[brightspace.courses]]
# code = "CEG2136"
# section = "A00"
# org_id = "12345"       # optional if auto-discovery can identify it
# download_files = true

[mail]
# uOttawa mail is Microsoft 365. Register a public-client app for delegated
# User.Read + Mail.Read only, then put the non-secret application/client ID here.
enabled = false
client_id = "REPLACE_WITH_AZURE_PUBLIC_CLIENT_APP_ID"
cache = ".auth/mail/msal_cache.json"
# Graph deltaLink is preferred because it tracks additions, updates, and removals.
use_delta = true
max_pages = 50
# Only attachments belonging to messages changed in the current delta cycle are checked.
# Their metadata fingerprints are persisted, so unchanged binaries are skipped.
download_attachments = false

[ollama]
base_url = "http://127.0.0.1:11434"
keep_alive = "1h"
