manifest_version = 1
api = "lifehub@1"
id = "external.energy-meter"
name = "External Energy Meter"
version = "1.0.0"

[[components]]
id = "measure"
runner = "lifehub.wasm-background"
contract = "lifehub.service-json@1"
provides = ["lab.energy.spent@1"]

[components.config]
module = "worker.wasm"

[components.config.restart]
max_retries = 2
window = 60
backoff = 0.2
max_backoff = 0.8
